[project]
name = "sentinelle"
version = "0.1.0"
description = "Assistant vocal d'atelier, local d'abord : cerveau Ollama ou Claude, domotique, impression 3D, calculs RDM."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "psutil>=5.9", "anthropic>=1.0", "paho-mqtt>=2.0"]

[project.optional-dependencies]
voix = ["vosk>=0.3.45", "sounddevice>=0.4"]
pi = ["gpiozero>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
sentinelle = "sentinelle.serveur:main"
sentinelle-voix = "sentinelle.voix:main"

[tool.setuptools.packages.find]
include = ["sentinelle*"]

[tool.setuptools.package-data]
sentinelle = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
