name: MetalForge — compilation et tests

on:
  push:
    paths: ["MetalForge/**", ".github/workflows/metalforge-core.yml"]
  pull_request:
    paths: ["MetalForge/**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MetalForge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Sans SolidWorks, l'add-in compile contre la maquette d'API (tools/MetalForge.SwStubs) : vérification de compilation seulement.
      - run: dotnet build MetalForge.sln -p:Configuration=Release -p:Platform=x64 --nologo
      - run: dotnet test src/MetalForge.Tests -c Release --nologo
