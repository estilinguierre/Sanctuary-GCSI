name: MetalForge — tests des moteurs (JS + C#)

on:
  push:
    paths: ["MetalForge/**", ".github/workflows/metalforge-core.yml"]
  pull_request:
    paths: ["MetalForge/**"]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MetalForge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Moteur de configuration atomique (JavaScript partagé web / SolidWorks)
      - run: node web/configurateur/engine.test.js
      # Le complément SolidWorks (Windows + licence SW) n'est pas compilé ici : uniquement le moteur C# et ses tests.
      - run: dotnet test tests/MetalForge.Core.Tests --nologo
