<!doctype html>
<html lang="fr">
<title>Configurateur MetalForge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : atelier — colonne de réglages (atomes), vue 3D au centre, fiche de résultats dessous. Accent « minium » (primaire antirouille). */
:root {
  --paper: #f3f4f1; --panel: #ffffff; --ink: #1a242e; --mute: #5d6874; --line: #d8dcd9; --steel: #3d5a73; --steel-2: #6f8aa1;
  --minium: #c4472a; --minium-soft: #f6e2db; --ok: #1f7a47; --warn: #a35f00; --ko: #b3261e; --info: #2f5b92; --viewer: #e9ecea;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; --body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11161b; --panel: #182027; --ink: #e2e7eb; --mute: #98a4af; --line: #2a343d; --steel: #8fb1cc; --steel-2: #6c8aa3;
  --minium: #e8693f; --minium-soft: #3a231b; --ok: #4cc283; --warn: #e3a646; --ko: #f07167; --info: #7fb0ee; --viewer: #0d1216; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11161b; --panel: #182027; --ink: #e2e7eb; --mute: #98a4af; --line: #2a343d; --steel: #8fb1cc; --steel-2: #6c8aa3;
  --minium: #e8693f; --minium-soft: #3a231b; --ok: #4cc283; --warn: #e3a646; --ko: #f07167; --info: #7fb0ee; --viewer: #0d1216; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.brand { font: 700 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.brand b { color: var(--minium); }
.brand small { font: 500 13px var(--body); text-transform: none; color: var(--mute); letter-spacing: 0; }
.status { margin-left: auto; display: flex; gap: 8px; align-items: center; font: 500 13px var(--mono); }
.pill { padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.ko { color: var(--ko); }
.cats { display: flex; flex-direction: column; gap: 6px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.catrow, .famrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.cat { font: 600 15px var(--display); text-transform: uppercase; letter-spacing: .05em; background: none; border: 0; color: var(--mute); padding: 4px 8px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
.cat[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--minium); }
.fam { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 5px 11px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.fam[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--minium); outline-offset: 2px; }
main { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); min-height: 0; }
aside.params { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); padding: 10px 12px 40px; min-width: 0; }
.ptitle { font: 700 20px var(--display); text-transform: uppercase; margin: 4px 2px 2px; letter-spacing: .02em; }
.pdesc { color: var(--mute); font-size: 12.5px; margin: 0 2px 8px; }
details.grp { border-top: 1px solid var(--line); }
details.grp > summary { list-style: none; cursor: pointer; padding: 9px 2px; font: 600 14px var(--display); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; align-items: center; }
details.grp > summary::after { content: "+"; font: 500 16px var(--mono); color: var(--mute); }
details.grp[open] > summary::after { content: "–"; }
details.grp > summary .atom { font: 500 10.5px var(--mono); color: var(--minium); letter-spacing: .04em; border: 1px solid var(--minium); border-radius: 3px; padding: 0 5px; margin-left: 8px; }
.field { display: grid; grid-template-columns: 1fr 128px; gap: 8px; align-items: center; padding: 4px 2px; }
.field label { font-size: 12.5px; color: var(--ink); }
.field .ctl { display: flex; align-items: center; gap: 4px; min-width: 0; }
.field input[type=number], .field input[type=text], .field select { width: 100%; min-width: 0; font: 13px var(--mono); padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); }
.field .u { font: 11px var(--mono); color: var(--mute); min-width: 28px; }
.field input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--minium); }
.center { display: grid; grid-template-rows: minmax(300px, 58%) minmax(0, 1fr); min-height: 0; min-width: 0; }
.viewer { position: relative; background: var(--viewer); min-height: 300px; border-bottom: 1px solid var(--line); }
.viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.vtools { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; }
.vtools button, .btn { font: 500 12px var(--body); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; }
.btn.primary { background: var(--minium); border-color: var(--minium); color: #fff; font-weight: 600; }
.vinfo { position: absolute; bottom: 10px; left: 10px; right: 10px; display: flex; gap: 16px; flex-wrap: wrap; font: 12px var(--mono); color: var(--mute); pointer-events: none; }
.vinfo b { color: var(--ink); font-weight: 500; }
.err { position: absolute; inset: auto 10px 40px 10px; background: var(--panel); border: 1px solid var(--ko); color: var(--ko); padding: 8px 12px; border-radius: 4px; font-size: 13px; }
.results { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--panel); }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 0 8px; }
.tab { font: 600 14px var(--display); text-transform: uppercase; letter-spacing: .05em; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--mute); padding: 9px 10px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--minium); }
.tab .n { font: 500 11px var(--mono); color: var(--mute); margin-left: 4px; }
.pane { overflow: auto; padding: 12px 16px 28px; min-width: 0; }
.checks { display: grid; gap: 4px; }
.chk { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 6px 8px; border-left: 3px solid var(--line); background: var(--paper); border-radius: 0 4px 4px 0; }
.chk.ok { border-left-color: var(--ok); } .chk.warn { border-left-color: var(--warn); } .chk.fail { border-left-color: var(--ko); } .chk.info { border-left-color: var(--info); }
.chk .i { font: 600 14px var(--mono); } .chk.ok .i { color: var(--ok); } .chk.warn .i { color: var(--warn); } .chk.fail .i { color: var(--ko); } .chk.info .i { color: var(--info); }
.chk .r { font-weight: 600; font-size: 13px; } .chk .m { font-size: 12.5px; } .chk .ref { font: 11px var(--mono); color: var(--mute); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 12px var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--mute); }
td.n { text-align: right; font-family: var(--mono); white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0 24px; }
.kv div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding: 5px 0; font-size: 13px; }
.kv span:last-child { font-family: var(--mono); text-align: right; }
.bar { display: flex; height: 20px; margin: 3px 0; border: 1px solid var(--steel-2); border-radius: 2px; overflow: hidden; font: 10.5px var(--mono); }
.bar span { background: var(--steel); color: var(--panel); border-right: 2px solid var(--panel); white-space: nowrap; overflow: hidden; padding: 2px 4px; }
.bar i { flex: 1; background: repeating-linear-gradient(45deg, transparent, transparent 4px, var(--line) 4px, var(--line) 8px); font-style: normal; color: var(--mute); padding: 2px 4px; text-align: right; }
h3 { font: 600 16px var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
.tot { font: 600 15px var(--mono); }
.atoms { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.atomcard { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.atomcard h4 { margin: 0 0 4px; font: 600 14px var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--minium); }
.atomcard li { font-size: 12.5px; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.atomcard ul { margin: 0; padding: 0; }
.flats svg { width: 100%; height: auto; max-height: 460px; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; }
.flats .cut { stroke: var(--minium); } .flats .bend { stroke: var(--steel); stroke-dasharray: 6 4; } .flats text { fill: var(--ink); font-family: var(--mono); }
.flats .dim { stroke: var(--info); } .flats .dt { fill: var(--info); }
.flatgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
textarea { width: 100%; min-height: 140px; font: 12px var(--mono); background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px; box-sizing: border-box; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.costin { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 18px; margin-bottom: 10px; }
.note { color: var(--mute); font-size: 12px; }
.hint { grid-column: 1 / -1; font: 11.5px var(--mono); color: var(--minium); margin-top: -2px; }
.field.wide { grid-template-columns: 1fr; gap: 4px; }
.flathead { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.flatcard { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin-bottom: 14px; }
.flatcard h3 { margin-top: 2px; }
.vtools select { font: 500 12px var(--body); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; max-width: 170px; }
@media (max-width: 860px) {
  .app { display: block; height: auto; }
  main { display: flex; flex-direction: column; }
  .center { display: block; order: -1; }
  .viewer { height: 52vh; }
  aside.params { border-right: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .results .pane { max-height: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .field { grid-template-columns: 1fr 140px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header>
    <div class="brand">Metal<b>Forge</b> <small>Configurateur atomique</small></div>
    <div class="status" id="status"></div>
  </header>
  <nav class="cats" aria-label="Ouvrages">
    <div class="catrow" id="cats" role="toolbar"></div>

  </nav>
  <main>
    <aside class="params" id="params" aria-label="Paramètres"></aside>

      <div class="viewer" id="viewer">
        <div class="vtools">
          <button id="v-iso" type="button">3D</button><button id="v-front" type="button">Face</button><button id="v-top" type="button">Dessus</button><button id="v-side" type="button">Côté</button>
          <button id="v-wire" type="button" aria-pressed="false">Filaire</button>
          <button id="v-mason" type="button" aria-pressed="true">Maçonnerie</button>
          <label class="sr" for="v-ral" hidden>Finition</label>
          <select id="v-ral" aria-label="Finition de l'acier">
            <option value="atomes">Couleur par brique</option><option value="7016" selected>RAL 7016 gris anthracite</option><option value="9005">RAL 9005 noir foncé</option>
            <option value="2100">Noir sablé 2100</option><option value="9010">RAL 9010 blanc pur</option><option value="7035">RAL 7035 gris clair</option>
            <option value="7022">RAL 7022 gris terre d'ombre</option><option value="6005">RAL 6005 vert mousse</option><option value="3004">RAL 3004 rouge pourpre</option>
            <option value="5003">RAL 5003 bleu saphir</option><option value="1015">RAL 1015 ivoire clair</option><option value="8019">RAL 8019 brun gris</option>
            <option value="galva">Galvanisé à chaud</option><option value="inox">Inox brossé</option><option value="corten">Acier Corten</option>

</div>

<script src="engine.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const E = window.MetalForgeEngine;
const host = window.chrome && window.chrome.webview ? window.chrome.webview : null; // SolidWorks (WebView2)
const SCHEMA = E.schema();
const CATS = [...new Set(SCHEMA.map(f => f.cat))];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (v, d = 0) => Number(v).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('mf.' + k) || 'null'); localStorage.setItem('mf.' + k, JSON.stringify(v)); } catch (e) { return null; } }

const state = { custom: {}, fam: store('fam') || 'garde-corps', params: {}, tab: 'checks', result: null, cost: Object.assign({ acier: 1.9, rate: 55, margin: 25, finish: 'thermolaquage' }, store('cost') || {}) };
SCHEMA.forEach(f => { state.params[f.id] = Object.assign(E.defaults(f.id), (store('p.' + f.id) || {})); });
if (!E.families[state.fam]) state.fam = 'garde-corps';

// ------------------------------------------------------------------ sélection d'ouvrage
function renderCats() {
  const cur = E.families[state.fam].cat;
  $('cats').innerHTML = CATS.map(c => `<button class="cat" type="button" aria-pressed="${c === cur}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  $('fams').innerHTML = SCHEMA.filter(f => f.cat === cur).map(f => `<button class="fam" type="button" aria-pressed="${f.id === state.fam}" data-fam="${f.id}">${esc(f.label)}</button>`).join('');
}
$('cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; state.fam = SCHEMA.find(f => f.cat === b.dataset.cat).id; select(); });
$('fams').addEventListener('click', e => { const b = e.target.closest('[data-fam]'); if (!b) return; state.fam = b.dataset.fam; select(); });
function select() { store('fam', state.fam); renderCats(); renderParams(); rebuild(true); }

// ------------------------------------------------------------------ paramètres (générés depuis le schéma)
const ATOM_TAG = { 'Poteaux': 'atome', 'Main courante': 'atome', 'Lisse basse': 'atome', 'Remplissage': 'atome', 'Fixation': 'atome', 'Marches': 'atome', 'Limons': 'assemblage', 'Garde-corps': 'assemblage',
  'Cadre': 'assemblage', 'Piliers': 'atome', 'Quincaillerie & sécurité': 'atome', 'Ossature': 'assemblage', 'Plancher': 'atome', 'Crinoline': 'assemblage', 'Échelle': 'atome', 'Outillage': 'procédé', 'Tôle': 'atome', 'Forme': 'géométrie', 'Toiture': 'assemblage', 'Couverture': 'atome', 'Accès': 'ouvrage' };
function visible(q, p) { if (!q.show) return true; const [k, ...vals] = q.show; return vals.some(v => v === p[k] || String(v) === String(p[k])); }
function renderParams() {
  const f = SCHEMA.find(x => x.id === state.fam), p = state.params[state.fam], groups = [];
  f.params.forEach(q => { let g = groups.find(x => x.name === q.g); if (!g) groups.push(g = { name: q.g, items: [] }); g.items.push(q); });
  const lists = new Set(f.params.filter(q => q.list).map(q => q.list));
  let h = `<div class="ptitle">${esc(f.label)}</div><p class="pdesc">${esc(f.cat)} · ${f.params.length} paramètres · chaque groupe est une brique réutilisable</p>`;
  groups.forEach((g, gi) => {
    const items = g.items.filter(q => visible(q, p)); if (!items.length) return;
    h += `<details class="grp" ${gi < 4 ? 'open' : ''}><summary><span>${esc(g.name)}${ATOM_TAG[g.name] ? `<span class="atom">${ATOM_TAG[g.name]}</span>` : ''}</span></summary>`;
    items.forEach(q => {
      const id = 'p-' + q.k, v = p[q.k];
      let ctl;
      if (q.t === 'sel') ctl = `<select id="${id}" data-k="${q.k}">${q.o.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
      else if (q.t === 'bool') ctl = `<input id="${id}" data-k="${q.k}" type="checkbox" ${v ? 'checked' : ''}>`;
      else if (q.t === 'prof' && state.custom[state.fam + '.' + q.k]) ctl = `<input id="${id}" data-k="${q.k}" type="text" value="${esc(v === '__auto' ? '' : v)}" placeholder="ex. TR90x45x3" spellcheck="false" autocomplete="off"><button class="btn" type="button" data-list="${q.k}" title="Revenir à la liste">Liste</button>`;
      else if (q.t === 'prof') {
        const V = String(v).toUpperCase(), known = (q.groups || []).some(g => g.o.some(o => o[0] === V));
        ctl = `<select id="${id}" data-k="${q.k}">${q.auto ? `<option value="__auto" ${v === '__auto' ? 'selected' : ''}>Auto — le plus léger conforme</option>` : ''}`
          + (q.groups || []).map(g => `<optgroup label="${esc(g.g)}">${g.o.map(o => `<option value="${o[0]}" ${o[0] === V ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</optgroup>`).join('')
          + (!known && v !== '__auto' ? `<option value="${esc(v)}" selected>Personnalisé : ${esc(v)}</option>` : '') + `<option value="__custom">Autre profil (saisie libre)…</option></select>`;
      }
      else if (q.t === 'text') ctl = `<input id="${id}" data-k="${q.k}" type="text" value="${esc(v)}" spellcheck="false">`;
      else ctl = `<input id="${id}" data-k="${q.k}" type="number" inputmode="decimal" step="${q.step || 1}" value="${esc(v)}">`;
      h += `<div class="field${q.t === 'prof' ? ' wide' : ''}"><label for="${id}">${esc(q.l)}</label><div class="ctl">${ctl}${q.u ? `<span class="u">${esc(q.u)}</span>` : ''}</div>${q.t === 'prof' && v === '__auto' ? `<div class="hint" id="ah-${q.k}"></div>` : ''}</div>`;
    });
    h += `</details>`;
  });
  h += `<div class="row"><button class="btn" type="button" id="reset">Valeurs par défaut</button></div>`;
  const open = [...$('params').querySelectorAll('details.grp')].map(d => d.open);
  $('params').innerHTML = h;
  if (open.length) $('params').querySelectorAll('details.grp').forEach((d, i) => { if (open[i] !== undefined) d.open = open[i]; });
  $('params').querySelectorAll('[data-list]').forEach(b => b.onclick = () => { delete state.custom[state.fam + '.' + b.dataset.list]; renderParams(); });
  $('reset').onclick = () => { state.params[state.fam] = E.defaults(state.fam); store('p.' + state.fam, null); renderParams(); rebuild(true); };
}
let tmr = null;
$('params').addEventListener('input', e => {
  const el = e.target.closest('[data-k]'); if (!el) return;
  const q = SCHEMA.find(x => x.id === state.fam).params.find(x => x.k === el.dataset.k), p = state.params[state.fam];
  if (q.t === 'prof' && el.value === '__custom') { state.custom[state.fam + '.' + q.k] = true; renderParams(); $('p-' + q.k).focus(); return; }
